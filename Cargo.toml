[workspace]
resolver = "2"
members = [
    "crates/eaten-at",
    "crates/eaten-at-atproto",
    "crates/eaten-at-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.89"

[workspace.dependencies]
eaten-at-atproto = { path = "crates/eaten-at-atproto" }
eaten-at-web = { path = "crates/eaten-at-web" }

anyhow = "1"
axum = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
